name: Deploy WAPAD to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare WAPAD build
        run: |
          perl -pi -e 's/\bWAPA\b/WAPAD/g' index.html assets/site.js
          perl -pi -e 's/Bank transfer, not advertised cash/Bank transfer-only settlement/g' index.html
          perl -pi -e 's/no advertised cash holdings, bank transfer, tamper-evident custody/no cash or virtual-asset settlement, bank transfer only, tamper-evident custody/g' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
